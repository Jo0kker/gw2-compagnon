name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Companion.Core.Tests --configuration Release
      - run: dotnet build tools/Companion.BridgeSimulator --configuration Release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Companion.Core.Tests --configuration Release
      - run: dotnet build src/Companion.Desktop --configuration Release
      - name: Publish Windows preview with bundled runtime
        run: dotnet publish src/Companion.Desktop --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output artifacts/windows-preview
      - uses: actions/upload-artifact@v4
        with:
          name: gw2-companion-windows-x64-preview-${{ github.sha }}
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Publish local bridge simulator
        run: dotnet publish tools/Companion.BridgeSimulator --configuration Release --runtime win-x64 --self-contained true --output artifacts/bridge-simulator
      - uses: actions/upload-artifact@v4
        with:
          name: gw2-bridge-simulator-windows-x64-${{ github.sha }}
          path: artifacts/bridge-simulator/
          if-no-files-found: error
          retention-days: 14
