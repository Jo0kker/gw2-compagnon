name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: python scripts/check-localization.py
      - run: dotnet run --project tests/Companion.Core.Tests --configuration Release
      - run: dotnet build tools/Companion.BridgeSimulator --configuration Release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: python scripts/check-localization.py
      - run: dotnet run --project tests/Companion.Core.Tests --configuration Release
      - run: dotnet build src/Companion.Desktop --configuration Release
      - name: Publish Windows preview with bundled runtime
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gw2-companion-windows-x64-preview-${{ github.sha }}
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Publish local bridge simulator
        run: ./scripts/package-windows.ps1 -Project tools/Companion.BridgeSimulator -Output artifacts/bridge-simulator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gw2-bridge-simulator-windows-x64-${{ github.sha }}
          path: artifacts/bridge-simulator/
          if-no-files-found: error
          retention-days: 14
